name: FSRS7 clean-slate QA

on:
  push:
    branches:
      - fsrs7-clean-slate

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fsrs7-clean-slate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install locked toolchain
        run: npm ci

      - name: Install browser QA runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Build with TypeScript 7
        run: npm run build

      - name: Refresh tracked checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path(".")
          manifest = root / "CHECKSUMS.sha256"
          out = []
          for line in manifest.read_text().splitlines():
              if "  ./" not in line:
                  out.append(line)
                  continue
              _, rel = line.split("  ./", 1)
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"Missing checksum target: {rel}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              out.append(f"{digest}  ./{rel}")
          manifest.write_text("\n".join(out) + "\n")
          PY

      - name: JavaScript syntax
        run: node --check dist/app.js

      - name: Core Python integrity
        run: |
          python3 tests/build-integrity.spec.py
          python3 tests/html-sanity.spec.py
          python3 tests/source-ownership.spec.py

      - name: Python regression and browser suites
        run: |
          set -euo pipefail
          for f in tests/*.spec.py; do
            case "$f" in
              tests/build-integrity.spec.py|tests/html-sanity.spec.py|tests/source-ownership.spec.py) continue ;;
            esac
            echo "==> $f"
            python3 "$f"
          done

      - name: Non-browser JavaScript regressions
        run: |
          set -euo pipefail
          for f in tests/*.spec.js; do
            echo "==> $f"
            node "$f"
          done

      - name: Commit generated artifacts and checksum refresh
        run: |
          if ! git diff --quiet -- dist/app.js index.html CHECKSUMS.sha256; then
            git config user.name "revision-director-qa"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/app.js index.html CHECKSUMS.sha256
            git commit -m "build: regenerate clean-slate artifacts [skip ci]"
            git push origin HEAD:fsrs7-clean-slate
          fi
