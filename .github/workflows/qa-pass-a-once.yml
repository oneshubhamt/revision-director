name: One-off Pass A QA measurements
on:
  push:
    branches: [working]
permissions:
  contents: read
jobs:
  benchmark:
    if: contains(github.event.head_commit.message, '[pass-a-baseline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm ci --prefix tools/fsrs-optimizer --no-audit --no-fund
      - run: python3 -m pip install --disable-pip-version-check playwright
      - run: test -x /usr/bin/chromium && python3 tests/qa-baseline.py
