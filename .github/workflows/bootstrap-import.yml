name: Bootstrap Revision Director

on:
  push:
    paths:
      - ".bootstrap.ready"

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Stage verified Revision Director source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive and source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/revision-director-source
          mkdir -p /tmp/revision-director-source
          echo "db30cd8bfad0633379b169ec74075b6fa93584fdfde181326e5cb981b8c9d90a  .bootstrap/source.tar.xz" | sha256sum -c -
          tar -xJf .bootstrap/source.tar.xz -C /tmp/revision-director-source
          cd /tmp/revision-director-source
          sha256sum -c CHECKSUMS.sha256
          python3 tests/html-sanity.spec.py
          node tests/pass-e1.spec.js
          python3 tests/source-ownership.spec.py

      - name: Publish application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/revision-director-source/. .
          cat > .gitignore <<'EOF'
          .DS_Store
          Thumbs.db
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .coverage
          .idea/
          .vscode/
          *.log
          EOF
          git add -A
          git commit -m "Import Revision Director VA7.1 Pass E1"
          git push origin HEAD:main
